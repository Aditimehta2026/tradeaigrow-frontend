<p-fluid>
  <div class="flex mt-4 sm:mt-8 px-4 sm:px-0">
    <div class="card flex flex-col gap-6 w-full p-4 sm:p-6">
      <div>
        <h2 class="text-base sm:text-lg md:text-xl font-semibold m-0">{{ 'Create Deposit' | translate }}</h2>
        <p class="text-sm text-surface-500 dark:text-surface-400 mt-1 mb-0">
          {{ 'Add deposit record for a user' | translate }}
        </p>
      </div>

      <form class="flex flex-col gap-5" (ngSubmit)="submit()">
        <div class="flex flex-col gap-2">
          <label for="userEmail" class="font-medium">{{ 'User Email' | translate }}</label>
          <p-select
            inputId="userEmail"
            [(ngModel)]="form.email"
            name="email"
            [options]="userEmails"
            [filter]="true"
            placeholder="Select user email"
            class="w-full"
            required
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label for="coin" class="font-medium">{{ 'Coin' | translate }}</label>
            <p-select
              inputId="coin"
              [(ngModel)]="form.coin"
              name="coin"
              [options]="coinOptions"
              placeholder="Select coin"
              class="w-full"
              required
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="depositAmount" class="font-medium">{{ 'Amount' | translate }}</label>
            <p-inputNumber
              inputId="depositAmount"
              [(ngModel)]="form.depositAmount"
              name="depositAmount"
              mode="currency"
              currency="USD"
              class="w-full"
              required
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="status" class="font-medium">{{ 'Status' | translate }}</label>
            <p-select
              inputId="status"
              [(ngModel)]="form.status"
              name="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              class="w-full"
              required
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="depositDate" class="font-medium">{{ 'Deposit Date & Time' | translate }}</label>
            <input
              pInputText
              id="depositDate"
              type="datetime-local"
              [(ngModel)]="form.depositDate"
              name="depositDate"
              class="w-full"
            />
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label for="address" class="font-medium">{{ 'Address' | translate }}</label>
          <input
            pInputText
            id="address"
            [(ngModel)]="form.address"
            name="address"
            placeholder="Enter wallet address"
            class="w-full"
            required
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-2">
            <label for="network" class="font-medium">{{ 'Network' | translate }}</label>
            <p-select
              inputId="network"
              [(ngModel)]="form.network"
              name="network"
              [options]="networkOptions"
              placeholder="Select network"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="wallet" class="font-medium">{{ 'Wallet' | translate }}</label>
            <p-select
              inputId="wallet"
              [(ngModel)]="form.wallet"
              name="wallet"
              [options]="walletOptions"
              placeholder="Select wallet"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2 md:col-span-2">
            <label for="txid" class="font-medium">{{ 'Txid' | translate }}</label>
            <input
              pInputText
              id="txid"
              [(ngModel)]="form.txid"
              name="txid"
              placeholder="Enter transaction ID"
              class="w-full"
            />
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <p-button
            type="submit"
            [label]="'Create Deposit' | translate"
            icon="pi pi-check"
            severity="success"
            [disabled]="!isFormValid || isSubmitting"
            styleClass="w-full sm:w-auto"
          />
          <p-button
            type="button"
            [label]="'Reset' | translate"
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
            (onClick)="resetForm()"
            styleClass="w-full sm:w-auto"
          />
        </div>
      </form>
    </div>
  </div>
</p-fluid>

<p-toast />

<div *ngIf="isLoading || isSubmitting" class="loading-overlay">
  <p-progressSpinner strokeWidth="4" animationDuration=".8s" styleClass="custom-spinner"></p-progressSpinner>
</div>
